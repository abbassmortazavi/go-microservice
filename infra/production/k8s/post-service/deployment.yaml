apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      containers:
        - name: post-service
          image: abbass69/post-service:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9094
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: DB_NAME
              value: "microservice_db"
            - name: RABBITMQ_URI
              value: "amqp://guest:guest@rabbitmq:5672/"